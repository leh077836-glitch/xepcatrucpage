<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đăng nhập · PageOps</title><style>*{box-sizing:border-box}body{margin:0;background:#edf3ef;color:#16352d;font:16px/1.5 'Segoe UI',Arial;min-height:100vh;display:grid;place-items:center;padding:20px}.card{background:white;border:1px solid #d9e6dd;border-radius:20px;max-width:440px;width:100%;padding:36px;box-shadow:0 18px 60px #16352d0d}h1{font-size:32px;margin:0}h1 span{color:#14785d}p{color:#657b73}label{display:block;margin-top:20px;font-weight:600}input,select,button{font:inherit;width:100%;padding:13px;border:1px solid #ccdcd2;border-radius:9px;margin-top:8px;color:#16352d;background:white}button{background:#14785d;color:white;cursor:pointer;margin-top:25px;border:0}button:disabled{opacity:.6}#error{color:#a43d2c;font-size:14px}small{color:#657b73}</style></head><body><main class="card"><h1>Page<span>Ops</span></h1><p>Lịch trực chung của đội ngũ.</p><form id="loginForm"><label for="role">Bạn truy cập với vai trò</label><select id="role"><option value="viewer">Nhân viên · Xem lịch</option><option value="admin">Quản lý · Cập nhật lịch</option></select><label for="password">Mật khẩu</label><input id="password" type="password" required maxlength="200" autocomplete="current-password"><p id="error" role="alert"></p><button id="submit" type="submit">Đăng nhập</button></form><p><small>Nhân viên dùng mật khẩu xem lịch do người quản lý cung cấp.</small></p></main><script>async function passwordProof(password,role){
 const response=await fetch('/api/login-config');const config=await response.json();if(!response.ok||!config.salts?.[role]||config.iterations!==600000)throw Error('Web chưa được khởi tạo mật khẩu.');
 const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveBits']);const bits=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:new TextEncoder().encode(config.salts[role]),iterations:600000},key,256);return Array.from(new Uint8Array(bits),v=>v.toString(16).padStart(2,'0')).join('');
}
document.getElementById('loginForm').onsubmit=async ev=>{ev.preventDefault();const button=document.getElementById('submit');button.disabled=true;document.getElementById('error').textContent='';try{const response=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({role:document.getElementById('role').value,proof:await passwordProof(document.getElementById('password').value,document.getElementById('role').value)})});const data=await response.json();if(!response.ok)throw Error(data.error||'Chưa đăng nhập được.');location.assign('/');}catch(e){document.getElementById('error').textContent=e.message;button.disabled=false;}};</script></body></html>
